name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          last=$(git tag -l "v${version}-r*" | sed "s/^v${version}-r//" | sort -n | tail -n 1)
          echo "name=${version}-r$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bin: kricon.exe
            archive: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bin: kricon
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            bin: kricon
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
            bin: kricon
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ASSET: kricon-${{ needs.version.outputs.name }}-${{ matrix.platform }}.${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v7

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} LICENSE dist/
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd dist && 7z a "../$ASSET" .)
          else
            tar -czf "$ASSET" -C dist .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ASSET }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.version.outputs.name }}
        run: gh release create "v$NAME" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "kricon $NAME" --notes ""
