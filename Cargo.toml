[package]
name = "kricon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
